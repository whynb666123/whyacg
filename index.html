let watchedAnime = new Set();
let animeTable = [];
const tableBody = document.querySelector('#anime-table tbody');
const tableHead = document.querySelector('#anime-table thead tr');
const countElement = document.getElementById('count');
const resetBtn = document.getElementById('reset-btn');
const exportImgBtn = document.getElementById('export-img-btn');

function loadWatchedAnime() {
    const saved = localStorage.getItem('watchedAnime');
    if (saved) watchedAnime = new Set(JSON.parse(saved));
    updateCount();
}
function saveWatchedAnime() {
    localStorage.setItem('watchedAnime', JSON.stringify([...watchedAnime]));
}
function updateCount() {
    countElement.textContent = watchedAnime.size;
}
function createTable() {
    tableHead.innerHTML = '<th class="year-header">年份</th>';
    tableBody.innerHTML = '';
    animeTable = [];
    const years = Object.keys(animeData).sort((a, b) => parseInt(a) - parseInt(b));
    let maxAnimeCount = 0;
    years.forEach(year => maxAnimeCount = Math.max(maxAnimeCount, animeData[year].length));
    for (let i = 0; i < maxAnimeCount; i++) {
        const th = document.createElement('th');
        th.textContent = `动漫${i+1}`;
        tableHead.appendChild(th);
    }
    years.forEach(year => {
        const row = document.createElement('tr');
        const yearCell = document.createElement('td');
        yearCell.className = 'year-column';
        yearCell.textContent = year;
        row.appendChild(yearCell);
        const animes = animeData[year];
        for (let i = 0; i < maxAnimeCount; i++) {
            const cell = document.createElement('td');
            cell.className = 'anime-cell';
            if (i < animes.length) {
                const animeName = animes[i];
                cell.innerHTML = `<div class="anime-name">${animeName}</div>`;
                const animeId = `${year}-${animeName}`;
                if (watchedAnime.has(animeId)) cell.classList.add('watched');
                cell.addEventListener('click', () => {
                    if (cell.classList.contains('watched')) {
                        cell.classList.remove('watched');
                        watchedAnime.delete(animeId);
                    } else {
                        cell.classList.add('watched');
                        watchedAnime.add(animeId);
                    }
                    updateCount();
                    saveWatchedAnime();
                });
                animeTable.push({id:animeId,year,name:animeName,cell});
            }
            row.appendChild(cell);
        }
        tableBody.appendChild(row);
    });
}
function resetAll() {
    if (confirm('确定要重置所有观看标记吗？')) {
        watchedAnime.clear();
        animeTable.forEach(item => item.cell.classList.remove('watched'));
        updateCount();
        saveWatchedAnime();
    }
}
function exportTableAsImage() {
    const tableContainer = document.querySelector('.table-container');
    const table = tableContainer.querySelector('table');
    // 记录原样式
    const prevWidth = tableContainer.style.width;
    const prevOverflow = tableContainer.style.overflowX;
    // 全宽展开
    tableContainer.style.width = table.scrollWidth + "px";
    tableContainer.style.overflowX = "visible";
    tableContainer.scrollLeft = 0;
    html2canvas(tableContainer, {
        backgroundColor: "#fff",
        scale: 2
    }).then(canvas => {
        // 恢复原样
        tableContainer.style.width = prevWidth;
        tableContainer.style.overflowX = prevOverflow;
        const link = document.createElement('a');
        link.href = canvas.toDataURL("image/png");
        link.download = `动漫观看统计表_${new Date().toLocaleDateString('zh-CN')}.png`;
        link.click();
    });
}
function init() {
    loadWatchedAnime();
    createTable();
    resetBtn.addEventListener('click', resetAll);
    exportImgBtn.addEventListener('click', exportTableAsImage);
}
document.addEventListener('DOMContentLoaded', init);
</script>
